# ---------------------------------------------------------------------------
# The DB server has no public IP, so Ansible cannot reach it directly.
# ProxyCommand tells SSH: "first connect to the web server, then from there
# open a tunnel to the database server." The web server acts as a bastion.
# ---------------------------------------------------------------------------
[db:vars]
ansible_ssh_common_args=-o ProxyCommand="ssh -W %h:%p -q -i /home/bharath/.ssh/travelmemory -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@13.235.244.210"

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=/home/bharath/.ssh/travelmemory
ansible_python_interpreter=/usr/bin/python3

